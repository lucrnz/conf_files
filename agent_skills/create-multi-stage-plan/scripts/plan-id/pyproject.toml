[project]
name = "plan-id"
version = "0.1.0"
description = "Mint a collision-checked plan directory basename"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plan-id = "plan_id.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "plan_id"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
