[project]
name = "shorten-url"
version = "0.1.0"
description = "Shorten a URL with v.gd"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shorten-url = "shorten_url.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shorten_url"
module-root = "src"
