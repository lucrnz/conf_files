[project]
name = "rearchiver"
version = "0.1.0"
description = "Recompress zip archives with 7z"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
rearchiver = "rearchiver.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rearchiver"
module-root = "src"
