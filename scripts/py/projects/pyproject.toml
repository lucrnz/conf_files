[project]
name = "projects"
version = "0.1.0"
description = "Manage local script projects: clear caches and uv sync"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
projects = "projects.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "projects"
module-root = "src"
